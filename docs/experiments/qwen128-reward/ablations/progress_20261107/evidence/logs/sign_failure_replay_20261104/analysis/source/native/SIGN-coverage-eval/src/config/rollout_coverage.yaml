habitat:
  task:
    measurements:
      - distance_to_goal
      - success
      - spl
      - soft_spl
      - distance_to_view
      - view_match
      - view_angle
      - collisions
      - observed_coverage

    observed_coverage:
      type: ObservedCoverage
      weight: 0.1
      # 0: episode/rollout ends only; positive: also settle every K rollout steps.
      settlement_interval: 0
      meters_per_pixel: 0.10
      visibility_dist: 3.0
      fov: 90.0
